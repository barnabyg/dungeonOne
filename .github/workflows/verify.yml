name: Verify

on:
  pull_request:
  # Branch pushes with an open PR are already covered by pull_request; running
  # both doubled every PR's CI. Push only re-checks main after a merge.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # npm run verify, split into parts that run at once, each on its own
  # runner: the checks part runs every verify gate with the tests that start
  # no browser, and the other parts run the rest of the tests
  # (scripts/run-tests.mjs CI_PARTS, which tests/test-tiers.test.mjs checks
  # this list against). In one job, verify took 8 to 14 minutes.
  part:
    name: ${{ matrix.part }}
    # Linux, not Windows: on near-identical code the job took 13.6 minutes on
    # ubuntu-latest and 23 on windows-latest (#468).
    runs-on: ubuntu-latest
    # A hung step should fail, not hold the PR for the 6-hour default.
    timeout-minutes: 20
    strategy:
      # Every part reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        part: [checks, browser-1, browser-2, gate-1, gate-2]
        # The browser parts run in Playwright's image, which has Chromium and
        # its system packages: installing them from the Ubuntu mirror timed
        # out on #265 and #549. The tag is package.json's playwright version,
        # which tests/test-tiers.test.mjs checks.
        include:
          - part: browser-1
            image: mcr.microsoft.com/playwright:v1.63.0-noble
          - part: browser-2
            image: mcr.microsoft.com/playwright:v1.63.0-noble
    # No image, no container: the other parts run on the runner itself.
    container:
      image: ${{ matrix.image }}
      # Chromium needs more shared memory than Docker's default.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.part == 'checks'
        run: npm run verify -- --ci-part checks
        env:
          CI: "true"
      - if: matrix.part != 'checks'
        run: npm test -- --ci-part ${{ matrix.part }}
        env:
          CI: "true"

  # The one check branch protection requires. It runs even when a part failed
  # or was cancelled, as a skipped required check counts as passed, and
  # passes only when every part passed.
  verify:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.part.result }}
