name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A full verify takes about 3 minutes; a hung step should fail, not hold the
    # PR for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        # This step has hung on the runner (PR #265); fail fast so a re-run can start.
        timeout-minutes: 10
      - run: npm run verify
        env:
          CI: "true"
