name: Verify

on:
  pull_request:
  # Branch pushes with an open PR are already covered by pull_request; running
  # both doubled every PR's CI. Push only re-checks main after a merge.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # npm run verify, split into parts that run at once, each on its own
  # runner: the checks part runs every verify gate with the tests that start
  # no browser, and the other parts run the rest of the tests
  # (scripts/run-tests.mjs CI_PARTS, which tests/test-tiers.test.mjs checks
  # this list against). In one job, verify took 8 to 14 minutes.
  part:
    name: ${{ matrix.part }}
    # Linux, not Windows: on near-identical code the job took 13.6 minutes on
    # ubuntu-latest and 23 on windows-latest (#468).
    runs-on: ubuntu-latest
    # A hung step should fail, not hold the PR for the 6-hour default.
    timeout-minutes: 20
    strategy:
      # Every part reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        part: [checks, browser-1, browser-2, gate-1, gate-2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium is cached by Playwright version, so a run downloads it only
      # when the version changes; its system packages still install each run.
      - if: startsWith(matrix.part, 'browser-')
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.part, 'browser-')
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # These steps have hung on the runner (PR #265, #549); fail fast so a
      # re-run can start.
      - if: startsWith(matrix.part, 'browser-') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - if: startsWith(matrix.part, 'browser-') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 10
      - if: matrix.part == 'checks'
        run: npm run verify -- --ci-part checks
        env:
          CI: "true"
      - if: matrix.part != 'checks'
        run: npm test -- --ci-part ${{ matrix.part }}
        env:
          CI: "true"

  # The one check branch protection requires. It runs even when a part failed
  # or was cancelled, as a skipped required check counts as passed, and
  # passes only when every part passed.
  verify:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.part.result }}
