name: Verify

on:
  pull_request:
  # Branch pushes with an open PR are already covered by pull_request; running
  # both doubled every PR's CI. Push only re-checks main after a merge.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Linux, not Windows: on near-identical code the job took 13.6 minutes on
    # ubuntu-latest and 23 on windows-latest (#468).
    runs-on: ubuntu-latest
    # A full verify takes about 14 minutes; a hung step should fail, not hold
    # the PR for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        # This step has hung on the runner (PR #265); fail fast so a re-run can start.
        timeout-minutes: 10
      - run: npm run verify
        env:
          CI: "true"
