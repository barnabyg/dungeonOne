name: Verify

on:
  pull_request:
  # Branch pushes with an open PR are already covered by pull_request; running
  # both doubled every PR's CI. Push only re-checks main after a merge.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Windows, the platform the game is played and developed on; Linux is not a
    # target.
    runs-on: windows-latest
    # A full verify took 11–17 minutes on Linux runners before the four-module
    # cut (#446); a hung step should fail, not hold the PR for the 6-hour
    # default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        # This step has hung on the runner (PR #265); fail fast so a re-run can start.
        timeout-minutes: 10
      - run: npm run verify
        env:
          CI: "true"
